{% extends 'dashboard/base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Sign in to your account</h2>
            <p class="mt-2 text-center text-sm text-gray-600">Or <a href="{% url 'signup' %}" class="text-indigo-600">create a new account</a></p>
        </div>
            <form class="mt-8 space-y-6 bg-white p-8 rounded-lg shadow" action="" method="POST" novalidate>
                {% csrf_token %}
                {% if errors.all %}
                    <div class="bg-red-50 border border-red-200 text-red-700 p-3 rounded">{{ errors.all }}</div>
                {% endif %}
                {% if errors.debug %}
                    <div class="mt-2 text-xs text-gray-500">Debug: {{ errors.debug }}</div>
                {% endif %}
            <div class="rounded-md shadow-sm -space-y-px">
                        <div class="mb-4">
                    <label for="username" class="sr-only">Username</label>
                              <input id="username" name="username" type="text" autocomplete="username" value="{{ username|default:'' }}" required
                                 class="appearance-none rounded relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                                 placeholder="Username">
                </div>
                <div>
                            <label for="password" class="sr-only">Password</label>
                            <div class="relative">
                                <input id="password" name="password" type="password" autocomplete="current-password" required
                                             class="appearance-none rounded relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                                             placeholder="Password">
                                <button type="button" id="togglePwd" class="absolute right-2 top-2 text-sm text-gray-500">Show</button>
                            </div>
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none">
                    Sign in
                </button>
            </div>
            <p class="text-sm text-center text-gray-600">Forgot your password? <a href="#" class="text-indigo-600">Reset</a></p>
        </form>
    </div>
</div>
{% endblock %}
<script>
document.addEventListener('DOMContentLoaded', function(){
    const pwd = document.getElementById('password');
    const btn = document.getElementById('togglePwd');
    if (pwd && btn) {
        btn.addEventListener('click', () => {
            if (pwd.type === 'password') { pwd.type = 'text'; btn.textContent = 'Hide'; }
            else { pwd.type = 'password'; btn.textContent = 'Show'; }
        });
    }
});
</script>
