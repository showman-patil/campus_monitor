{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container mx-auto px-6 py-12">
  <h1 class="text-2xl font-bold mb-4">Data Provenance</h1>
  <div class="space-y-3">
    {% for p in prov %}
      <div class="bg-white p-3 rounded shadow">
        <div class="flex justify-between">
          <div>
            <div class="font-medium">{{ p.source }} · {{ p.record_type }}</div>
            <div class="text-xs text-gray-500">ID: {{ p.record_id }}</div>
          </div>
          <div class="text-sm text-gray-500">{{ p.imported_at }}</div>
        </div>
      </div>
    {% empty %}
      <div class="text-gray-500">No provenance records</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
