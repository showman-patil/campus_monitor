{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container mx-auto px-6 py-12">
  <h1 class="text-2xl font-bold mb-4">Swipe Logs</h1>
  <div class="space-y-3">
    {% for s in swipes %}
      <div class="bg-white p-3 rounded shadow">
        <div class="flex justify-between">
          <div>
            <div class="text-sm text-gray-600">{{ s.card_id }} @ {{ s.location }}</div>
            <div class="text-xs text-gray-500">{{ s.raw }}</div>
          </div>
          <div class="text-sm text-gray-500">{{ s.timestamp }}</div>
        </div>
      </div>
    {% empty %}
      <div class="text-gray-500">No swipes</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
