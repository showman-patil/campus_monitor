{% extends 'dashboard/base.html' %}

{% block content %}
<div class="container mx-auto px-6 py-12">
    <div class="flex items-center justify-between mb-6">
        <h1 class="page-title">Entities</h1>
        <div class="text-sm muted">Showing {{ entities|length }} entities</div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for e in entities %}
            <a href="{% url 'entity_detail' e.id %}" class="block card hover:shadow-xl transition p-5">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-800">{{ e.name }}</h3>
                        <div class="text-sm text-gray-500 mt-1">{{ e.type }}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm text-gray-600">{{ e.last_seen }}</div>
                        <div class="text-xs mt-2 text-gray-500">Conf: <span class="font-semibold">{{ e.confidence|default:'—' }}</span></div>
                    </div>
                </div>
            </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
