{% extends 'dashboard/base.html' %}

{% block content %}
<div class="container mx-auto px-6 py-12">
    <h1 class="text-4xl font-bold text-gray-800 mb-8">Predictive Analytics</h1>
    
    <div id="prediction" class="bg-white rounded-lg shadow-lg p-8">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-indigo-600 mb-2" id="entity">Loading...</h2>
            <p class="text-gray-600">Location Prediction Analysis</p>
        </div>

        <div class="max-w-md mx-auto">
            <div class="mb-6">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-700 font-semibold">Predicted Location</span>
                    <span class="text-indigo-600 font-bold" id="location">-</span>
                </div>
            </div>

            <div class="mb-6">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-700 font-semibold">Confidence Score</span>
                    <span class="text-indigo-600 font-bold" id="confidence">-</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4">
                    <div id="confidenceBar" class="bg-indigo-600 h-4 rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <div class="bg-blue-50 border-l-4 border-indigo-600 p-4 rounded">
                <h3 class="font-bold text-gray-800 mb-2">Explainability</h3>
                <p class="text-gray-600" id="explanation">-</p>
            </div>
        </div>
    </div>
</div>

<script>
async function loadPrediction() {
    const response = await fetch('/api/predict/');
    const data = await response.json();
    
    document.getElementById('entity').textContent = data.entity;
    document.getElementById('location').textContent = data.predicted_location;
    document.getElementById('confidence').textContent = `${(data.confidence * 100).toFixed(0)}%`;
    document.getElementById('explanation').textContent = data.explanation;
    
    setTimeout(() => {
        document.getElementById('confidenceBar').style.width = `${data.confidence * 100}%`;
    }, 100);
}

loadPrediction();
</script>
{% endblock %}
