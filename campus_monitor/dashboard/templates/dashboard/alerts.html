{% extends 'dashboard/base.html' %}

{% block content %}
<div class="container mx-auto px-6 py-12">
    <h1 class="text-4xl font-bold text-gray-800 mb-8">Security Alerts</h1>
    
    <div class="bg-white rounded-lg shadow-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Entity</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Seen</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Hours Since</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                </tr>
            </thead>
            <tbody id="alertsTable" class="bg-white divide-y divide-gray-200"></tbody>
        </table>
    </div>
</div>

<script>
async function loadAlerts() {
    const response = await fetch('/api/alerts/');
    const data = await response.json();
    const tbody = document.getElementById('alertsTable');
    
    data.forEach(alert => {
        const lastSeen = new Date(alert.last_seen);
        const now = new Date();
        const hoursSince = Math.floor((now - lastSeen) / (1000 * 60 * 60));
        const isUrgent = hoursSince > 12;
        
        const row = document.createElement('tr');
        row.className = isUrgent ? 'bg-red-50' : '';
        row.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${alert.entity}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${alert.type}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${lastSeen.toLocaleString()}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${hoursSince}h</td>
            <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${isUrgent ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'}">
                    ${alert.status}
                </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm">
                <button class="text-indigo-600 hover:text-indigo-900">Resolve Alert</button>
            </td>
        `;
        tbody.appendChild(row);
    });
}

loadAlerts();
</script>
{% endblock %}
