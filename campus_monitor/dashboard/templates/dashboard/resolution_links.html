{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container mx-auto px-6 py-12">
  <h1 class="text-2xl font-bold mb-4">Resolution Links</h1>
  <div class="bg-white rounded shadow p-4">
    <table class="w-full text-sm">
      <thead>
        <tr class="text-left text-gray-600">
          <th>Left</th><th>Right</th><th>Confidence</th><th>Evidence</th>
        </tr>
      </thead>
      <tbody>
        {% for l in links %}
        <tr class="border-t">
          <td>{{ l.left_type }}: {{ l.left_value }}</td>
          <td>{{ l.right_type }}: {{ l.right_value }}</td>
          <td>{{ l.confidence }}</td>
          <td class="text-xs text-gray-500">{{ l.evidence }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No links</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
