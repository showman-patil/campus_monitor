{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container mx-auto px-6 py-12">
  <h1 class="text-2xl font-bold mb-4">Library Checkouts</h1>
  <div class="space-y-3">
    {% for c in checkouts %}
      <div class="bg-white p-3 rounded shadow">
        <div class="flex justify-between">
          <div>
            <div class="font-medium">{{ c.item }}</div>
            <div class="text-sm text-gray-600">By {{ c.entity.name if c.entity else '—' }}</div>
          </div>
          <div class="text-sm text-gray-500">{{ c.checkout_time }} (due {{ c.due_time }})</div>
        </div>
      </div>
    {% empty %}
      <div class="text-gray-500">No checkouts</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
