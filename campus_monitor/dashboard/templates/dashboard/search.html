{% extends 'dashboard/base.html' %}

{% block content %}
<div class="container mx-auto px-6 py-12">
    <h1 class="text-4xl font-bold text-gray-800 mb-8">Entity Search</h1>
    
    <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-gray-700 mb-2">Entity Type</label>
                <select id="entityType" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <option value="">All Types</option>
                    <option value="Student">Student</option>
                    <option value="Staff">Staff</option>
                    <option value="Asset">Asset</option>
                    <option value="Device">Device</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label class="block text-gray-700 mb-2">Search</label>
                <div class="flex gap-2">
                    <input type="text" id="searchInput" placeholder="Search by name, email, or ID" 
                           class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <button onclick="searchEntities()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition duration-300">
                        Search
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="loading" class="hidden text-center py-8">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
        <p class="text-gray-600 mt-4">Loading...</p>
    </div>

    <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</div>

<script>
async function searchEntities() {
    const loading = document.getElementById('loading');
    const results = document.getElementById('results');
    
    loading.classList.remove('hidden');
    results.innerHTML = '';
    
    const response = await fetch('/api/search/');
    const data = await response.json();
    
    loading.classList.add('hidden');
    
    const entityType = document.getElementById('entityType').value;
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    
    const filtered = data.filter(entity => {
        const matchesType = !entityType || entity.type === entityType;
        const matchesSearch = !searchTerm || entity.name.toLowerCase().includes(searchTerm);
        return matchesType && matchesSearch;
    });
    
    filtered.forEach(entity => {
        const confidence = entity.confidence;
        const badgeColor = confidence > 0.9 ? 'bg-green-500' : confidence > 0.7 ? 'bg-yellow-500' : 'bg-red-500';
        
        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition duration-300';
        card.innerHTML = `
            <div class="flex justify-between items-start mb-4">
                <h3 class="text-xl font-bold text-gray-800">${entity.name}</h3>
                <span class="${badgeColor} text-white text-sm px-3 py-1 rounded-full">${(confidence * 100).toFixed(0)}%</span>
            </div>
            <div class="space-y-2 text-gray-600">
                <p><strong>Type:</strong> ${entity.type}</p>
                <p><strong>Source:</strong> ${entity.source}</p>
                <p><strong>Last Seen:</strong> ${new Date(entity.timestamp).toLocaleString()}</p>
            </div>
        `;
        results.appendChild(card);
    });
}

searchEntities();
</script>
{% endblock %}
