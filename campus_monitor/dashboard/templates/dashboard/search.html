{% extends 'dashboard/base.html' %}

{% block content %}
<div class="container mx-auto px-6 py-12">
    <h1 class="page-title">Entity Search</h1>
    
    <div class="card p-6 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div>
                <label class="block text-gray-700 mb-2">Entity Type</label>
                <select id="entityType" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <option value="">All Types</option>
                    <option value="Student">Student</option>
                    <option value="Staff">Staff</option>
                    <option value="Asset">Asset</option>
                    <option value="Device">Device</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label class="block text-gray-700 mb-2">Search</label>
                <div class="flex gap-2">
                    <input type="text" id="searchInput" placeholder="Search by name, email, or ID" 
                           class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <button onclick="searchEntities()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition duration-300">
                        Search
                    </button>
                </div>
            </div>
            <div class="hidden md:block">
                <label class="block text-gray-700 mb-2">Quick</label>
                <div class="flex gap-2">
                    <button onclick="applyQuick('recent')" class="px-3 py-2 bg-gray-100 rounded hover:bg-gray-200">Recent</button>
                    <button onclick="applyQuick('high_conf')" class="px-3 py-2 bg-gray-100 rounded hover:bg-gray-200">High Confidence</button>
                    <button onclick="applyQuick('all')" class="px-3 py-2 bg-gray-100 rounded hover:bg-gray-200">All</button>
                </div>
            </div>
        </div>
    </div>

    <div id="summary" class="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="card p-4">
            <div class="text-sm text-gray-500">Total entities</div>
            <div id="stat-count" class="text-2xl font-bold text-gray-800">—</div>
        </div>
        <div class="card p-4">
            <div class="text-sm text-gray-500">Last updated</div>
            <div id="stat-last" class="text-lg text-gray-700">—</div>
        </div>
        <div class="card p-4">
            <div class="text-sm text-gray-500">Top types</div>
            <div id="stat-types" class="text-sm text-gray-700">—</div>
        </div>
    </div>

    <div id="loading" class="hidden text-center py-8">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
        <p class="text-gray-600 mt-4">Loading...</p>
    </div>

    <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</div>

{% if initial_entities %}
<script id="initial-entities" type="application/json">{{ initial_entities|safe }}</script>
{% endif %}
{% if search_stats %}
<script id="search-stats" type="application/json">{{ search_stats|safe }}</script>
{% endif %}

<script>
function renderResultsFromPayload(payload) {
    const results = document.getElementById('results');
    results.innerHTML = '';
    const data = payload.results || [];

    data.forEach(entity => {
        const confidence = entity.confidence;
        const badgeColor = confidence > 0.9 ? 'bg-green-500' : confidence > 0.7 ? 'bg-yellow-500' : 'bg-red-500';

    const card = document.createElement('div');
    card.className = 'bg-white rounded-lg shadow p-5 hover:shadow-xl transition duration-200';

        // Build the details section conditionally
        let details = '';
        if (entity.source) {
            details += `<p><strong>Source:</strong> ${entity.source}</p>`;
        }
        if (entity.timestamp) {
            details += `<p><strong>Last Seen:</strong> ${new Date(entity.timestamp).toLocaleString()}</p>`;
        }

        card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 class="text-xl font-bold text-gray-800">${entity.name}</h3>
                    <div class="text-sm text-gray-500 mt-1">Type: <span class="font-semibold">${entity.type}</span></div>
                </div>
                <div class="text-right">
                    <div class="${badgeColor} text-white text-sm px-3 py-1 rounded-full inline-block">${(confidence * 100).toFixed(0)}%</div>
                </div>
            </div>
            <div class="space-y-2 text-gray-600">
                ${details}
                <div class="text-sm mt-2 text-gray-500">ID: <span class="font-mono text-xs">${entity.name.replace(/\s+/g, '-').toLowerCase()}</span></div>
            </div>
        `;
        results.appendChild(card);
    });
}

function applyQuick(mode){
    const searchInput = document.getElementById('searchInput');
    const entityType = document.getElementById('entityType');
    if(mode === 'recent'){
        searchInput.value = '';
        entityType.value = '';
        doSearch({recent_hours: 24});
    } else if(mode === 'high_conf'){
        searchInput.value = '';
        entityType.value = '';
        doSearch({min_confidence: 0.8});
    } else if(mode === 'all'){
        searchInput.value = '';
        entityType.value = '';
        doSearch({});
    }
}

async function searchEntities() {
    const loading = document.getElementById('loading');
    loading.classList.remove('hidden');

    // use API search with current filters
    const params = {
        q: document.getElementById('searchInput').value,
        type: document.getElementById('entityType').value,
    };
    doSearch(params);
}

async function doSearch(extraParams){
    const loading = document.getElementById('loading');
    loading.classList.remove('hidden');
    const params = new URLSearchParams();
    const q = extraParams && extraParams.q !== undefined ? extraParams.q : document.getElementById('searchInput').value;
    const type = extraParams && extraParams.type !== undefined ? extraParams.type : document.getElementById('entityType').value;
    if(q) params.set('q', q);
    if(type) params.set('type', type);
    if(extraParams && extraParams.min_confidence) params.set('min_confidence', extraParams.min_confidence);
    if(extraParams && extraParams.recent_hours) params.set('recent_hours', extraParams.recent_hours);

    const response = await fetch('/api/search/?' + params.toString());
    const payload = await response.json();
    loading.classList.add('hidden');

    // populate stats from payload
    try{
        document.getElementById('stat-count').innerText = payload.count || 0;
        document.getElementById('stat-last').innerText = payload.last_updated ? new Date(payload.last_updated).toLocaleString() : '—';
        const types = payload.types || {};
        const pairs = Object.keys(types).slice(0,5).map(k => `${k}: ${types[k]}`);
        document.getElementById('stat-types').innerText = pairs.join(' · ') || '—';
    }catch(e){
        console.warn('Failed parsing payload stats', e);
    }

    renderResultsFromPayload(payload);
}

// re-run when filters change
document.getElementById('entityType').addEventListener('change', searchEntities);
document.getElementById('searchInput').addEventListener('input', searchEntities);

// initialize from server data if provided, otherwise fetch
searchEntities();
</script>
{% endblock %}
