{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container mx-auto px-6 py-12">
  <h1 class="text-2xl font-bold mb-4">Bookings</h1>
  <div class="space-y-3">
    {% for b in bookings %}
      <div class="bg-white p-3 rounded shadow">
        <div class="flex justify-between">
          <div>
            <div class="font-medium">{{ b.resource }}</div>
            <div class="text-sm text-gray-600">By {{ b.entity.name if b.entity else '—' }}</div>
          </div>
          <div class="text-sm text-gray-500">{{ b.start }} — {{ b.end }}</div>
        </div>
      </div>
    {% empty %}
      <div class="text-gray-500">No bookings</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
