{% extends 'dashboard/base.html' %}

{% block content %}
<div class="container mx-auto px-6 py-12">
    <h1 class="text-4xl font-bold text-gray-800 mb-8">Activity Timeline</h1>
    
    <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
        <h2 class="text-2xl font-bold text-indigo-600 mb-4">Summary of Day</h2>
        <p class="text-gray-600">Chronological reconstruction of campus activities and events</p>
    </div>

    <div id="timeline" class="space-y-4"></div>
</div>

<script>
async function loadTimeline() {
    const response = await fetch('/api/timeline/');
    const data = await response.json();
    const container = document.getElementById('timeline');
    
    data.forEach((event, index) => {
        const item = document.createElement('div');
        item.className = 'bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition duration-300 cursor-pointer';
        item.innerHTML = `
            <div class="flex items-center gap-4">
                <div class="text-3xl">${event.icon}</div>
                <div class="flex-1">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg font-bold text-gray-800">${event.event}</h3>
                        <span class="text-indigo-600 font-semibold">${event.time}</span>
                    </div>
                    <div class="text-gray-500 text-sm mt-1">Click to expand details</div>
                </div>
            </div>
            <div class="hidden mt-4 pt-4 border-t border-gray-200 text-gray-600" id="details-${index}">
                <p><strong>Location:</strong> Main Campus</p>
                <p><strong>Entity:</strong> Rahul Patel</p>
                <p><strong>Confidence:</strong> High</p>
            </div>
        `;
        
        item.onclick = () => {
            const details = document.getElementById(`details-${index}`);
            details.classList.toggle('hidden');
        };
        
        container.appendChild(item);
    });
}

loadTimeline();
</script>
{% endblock %}
